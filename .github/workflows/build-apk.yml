name: Rebuild and Patch Fanik APK for Android 13

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  patch-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zipalign curl wget unzip 

      - name: Install gdown
        run: |
          python3 -m pip install --upgrade pip
          pip install gdown

      - name: Download APK from Google Drive (gdown)
        run: |
          FILE_ID="1D0MR8xYsqg3awVF4IhagmYCGUkKfRcNs"
          # Try up to 3 times in case of transient network issues
          for i in 1 2 3; do
            echo "Attempt $i to download APK..."
            gdown --id "$FILE_ID" -O app-release.apk && break || sleep 5
          done

      - name: Verify downloaded APK (binary + zip test)
        run: |
          echo "file output:"
          file app-release.apk || true
          # Require a minimal reasonable size (e.g. 100KB) to avoid HTML or empty files
          MIN_SIZE=102400
          if [ ! -s app-release.apk ] || [ $(stat -c%s app-release.apk) -lt $MIN_SIZE ]; then
            echo "Error: app-release.apk is missing or unexpectedly small (size < $MIN_SIZE)."
            echo "Showing first 200 bytes for debugging:"
            head -c 200 app-release.apk | sed -n '1,200p'
            exit 1
          fi
          # Quick zip sanity check
          if ! unzip -tq app-release.apk >/dev/null 2>&1; then
            echo "Error: app-release.apk is not a valid ZIP/APK. Showing first 200 bytes for debugging:"
            head -c 200 app-release.apk | sed -n '1,200p'
            exit 1
          fi

      - name: Decompile APK
        run: |
          apktool d app-release.apk -o decompiled_app -f

      - name: Update SDK Versions for Android 13
        run: |
          sed -i 's/targetSdkVersion: .*/targetSdkVersion: '\''33'\''/' decompiled_app/apktool.yml
          sed -i 's/minSdkVersion: .*/minSdkVersion: '\''21'\''/' decompiled_app/apktool.yml

      - name: Rebuild Unsigned APK
        run: |
          apktool b decompiled_app -o unsigned_app.apk

      - name: ZipAlign APK
        run: |
          zipalign -v -p 4 unsigned_app.apk aligned_app.apk

      - name: Sign APK with Uber APK Signer
        run: |
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer-1.3.0.jar --apks aligned_app.apk --out .
          mv aligned_app-aligned-signed.apk fanik-patched.apk

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: fanik-patched-android13
          path: fanik-patched.apk
